# Publica index.html como página viva en GitHub Pages.
#
# Se dispara DESPUÉS de que `pruebas` termine en verde, no en cada push. Un push
# rojo no debe llegar a la página: si la suite falla, aquí no se despliega nada y
# lo que haya publicado sigue siendo la última versión que pasó.
name: pagina

on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cortar un despliegue
# a medias puede dejar la página en un estado intermedio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # En workflow_dispatch no hay conclusión que mirar; en workflow_run sí.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # `enablement: true` sólo sirve SI Pages ya está activado: el GITHUB_TOKEN
      # de Actions no tiene permiso para crear el sitio (eso es administración
      # del repositorio), así que la primera vez falla con «Resource not
      # accessible by integration». Se deja puesto porque en cuanto Pages esté
      # activado este paso lo encuentra y no intenta crear nada.
      - id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # No falla: AVISA y se queda quieto.
      #
      # La primera versión hacía `exit 1`, con el argumento de que sin página hay
      # que verlo rojo. Estaba mal: «Pages sin activar» es una configuración del
      # dueño, no una regresión, y un check rojo en CADA push entrena a ignorar el
      # rojo — el mismo motivo por el que capa2 no admite guardianes que fallen
      # siempre. La suite (`pruebas`) es la que dice si el código está bien, y esa
      # sí es roja cuando toca. En cuanto Pages esté activado, el siguiente push
      # que pase la suite publica sin tocar nada de aquí.
      - name: Pages no está activado
        if: steps.cfg.outcome == 'failure'
        run: |
          {
            echo "### Pages no está activado"
            echo ""
            echo "Un workflow no puede activarlo: el \`GITHUB_TOKEN\` de Actions no tiene permiso"
            echo "para **crear** el sitio de Pages — eso es administración del repositorio."
            echo ""
            echo "**Settings → Pages → Build and deployment → Source: GitHub Actions**"
            echo ""
            echo "<https://github.com/${{ github.repository }}/settings/pages>"
            echo ""
            echo "Hecho eso, el próximo push que pase la suite publica solo."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Pages no está activado::Settings → Pages → Source: GitHub Actions. Hasta entonces no se despliega nada."

      # Sólo lo que la página necesita. index.html es autosuficiente: no
      # referencia ningún archivo del repositorio, así que test/ y engine/ no
      # tienen por qué acabar servidos.
      - name: Armar lo que se publica
        if: steps.cfg.outcome == 'success'
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html
          cp .nojekyll sitio/.nojekyll
          ls -la sitio

      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outcome == 'success'
        with:
          path: sitio

      - id: deploy
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4
